<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CRM SaaS</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            margin:0;
            font-family:'Segoe UI';
            display:flex;
            background:#f1f5f9;
        }

        /* SIDEBAR */
        .sidebar {
            width:240px;
            background:#0f172a;
            color:white;
            height:100vh;
            padding:20px;
        }

        .sidebar h2 {
            color:#3b82f6;
        }

        .menu {
            margin-top:30px;
        }

        .menu div {
            padding:12px;
            border-radius:10px;
            cursor:pointer;
            display:flex;
            align-items:center;
            gap:10px;
        }

        .menu div:hover, .active {
            background:#1e293b;
        }

        /* MAIN */
        .main {
            flex:1;
            padding:20px;
        }

        /* TOPBAR */
        .topbar {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .icons i {
            margin:0 10px;
            cursor:pointer;
        }

        .user {
            display:flex;
            align-items:center;
            gap:10px;
        }

        /* CARDS */
        .cards {
            display:flex;
            gap:20px;
        }

        .card {
            flex:1;
            padding:20px;
            border-radius:15px;
            color:white;
            box-shadow:0 10px 20px rgba(0,0,0,0.15);
        }

        .blue {background:linear-gradient(45deg,#3b82f6,#2563eb);}
        .green {background:linear-gradient(45deg,#22c55e,#16a34a);}
        .orange {background:linear-gradient(45deg,#f59e0b,#d97706);}
        .purple {background:linear-gradient(45deg,#8b5cf6,#7c3aed);}

        /* SECTIONS */
        .section {
            background:white;
            padding:20px;
            margin-top:20px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        /* FLEX */
        .flex {
            display:flex;
            gap:20px;
        }

        /* TABLE */
        table {
            width:100%;
            border-collapse:collapse;
        }
        th, td {
            padding:12px;
            border-bottom:1px solid #eee;
        }

        /* INPUT */
        input {
            padding:10px;
            border-radius:8px;
            border:1px solid #ccc;
        }

        button {
            padding:10px;
            background:#3b82f6;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        /* TASK */
        .task {
            display:flex;
            justify-content:space-between;
            padding:10px 0;
        }

        .badge {
            padding:3px 8px;
            border-radius:10px;
            font-size:12px;
        }
        .high {background:#fee2e2;}
        .medium {background:#fef9c3;}
        .low {background:#dcfce7;}
    </style>
</head>

<body>

<div class="sidebar">
    <h2><i class="fa fa-chart-line"></i> CRM</h2>

    <div class="menu">
        <div class="active"><i class="fa fa-home"></i> Dashboard</div>
        <div><i class="fa fa-users"></i> Customers</div>
        <div><i class="fa fa-bullseye"></i> Leads</div>
        <div><i class="fa fa-briefcase"></i> Deals</div>
        <div><i class="fa fa-cog"></i> Settings</div>
    </div>
</div>

<div class="main">

    <div class="topbar">
        <input placeholder="Search...">

        <div class="icons">
            <i class="fa fa-bell"></i>
            <i class="fa fa-envelope"></i>
        </div>

        <div class="user">
            <img src="https://i.pravatar.cc/40">
            <span>Admin</span>
        </div>
    </div>

    <div class="cards">
        <div class="card blue"><h3>Customers</h3><h1 id="count">0</h1></div>
        <div class="card green"><h3>Leads</h3><h1>856</h1></div>
        <div class="card orange"><h3>Deals</h3><h1>425</h1></div>
        <div class="card purple"><h3>Revenue</h3><h1>$75,450</h1></div>
    </div>

    <div class="flex">

        <div class="section" style="flex:2;">
            <h3>Sales Overview</h3>
            <canvas id="lineChart"></canvas>
        </div>

        <div class="section" style="flex:1;">
            <h3>Deals</h3>
            <canvas id="pieChart"></canvas>
        </div>

    </div>

    <div class="flex">

        <div class="section" style="flex:2;">
            <h3>Customers</h3>

            <input id="name" placeholder="Name">
            <input id="email" placeholder="Email">
            <button onclick="add()">Add</button>

            <table>
                <thead>
                <tr><th>Name</th><th>Email</th></tr>
                </thead>
                <tbody id="table"></tbody>
            </table>
        </div>

        <div class="section" style="flex:1;">
            <h3>Tasks</h3>
            <div class="task">Call client <span class="badge high">High</span></div>
            <div class="task">Send proposal <span class="badge medium">Medium</span></div>
            <div class="task">Meeting <span class="badge low">Low</span></div>
        </div>

    </div>

</div>

<script>

    // line chart
    new Chart(document.getElementById("lineChart"), {
        type: 'line',
        data: {
            labels:["Mon","Tue","Wed","Thu","Fri"],
            datasets:[{label:"Sales",data:[10,20,15,30,25],borderColor:"#3b82f6"}]
        }
    });

    // pie chart
    new Chart(document.getElementById("pieChart"), {
        type: 'doughnut',
        data: {
            labels:["New","Contact","Won"],
            datasets:[{data:[30,40,30]}]
        }
    });

    // backend
    async function add(){
        let name=document.getElementById("name").value;
        let email=document.getElementById("email").value;

        await fetch("/customers",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({name,email})
        });

        load();
    }

    async function load(){
        let res=await fetch("/customers");
        let data=await res.json();

        let table=document.getElementById("table");
        table.innerHTML="";

        data.forEach(c=>{
            table.innerHTML+=`<tr><td>${c.name}</td><td>${c.email}</td></tr>`;
        });

        document.getElementById("count").innerText=data.length;
    }

    window.onload=load;

</script>

</body>
</html>
